server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name bloom.surveycorps.cn;

    ssl_certificate /etc/letsencrypt/live/bloom.surveycorps.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloom.surveycorps.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/bloom/current/frontend;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location ^~ /api/auth/ {
        limit_req zone=bloom_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        limit_req zone=bloom_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /var/lib/bloom/uploads/;
        expires 1h;
    }

    location ^~ /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location ^~ /vendor/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /app.js {
        expires -1;
    }

    location = /styles.css {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bloom.surveycorps.cn;
    return 301 https://$host$request_uri;
}
